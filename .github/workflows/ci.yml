name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -v

  render-samples:
    # Manually triggered: renders every campaign and uploads the videos.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Render campaigns
        run: |
          for campaign in campaigns/*.yaml; do
            name=$(basename "$campaign" .yaml)
            commercial-suite generate --campaign "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: output/
