[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commercial-suite"
version = "0.1.0"
description = "Video content generation suite for marketing and campaigns, driven by a brand kit and campaign configs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "Pillow>=12.2.0,<13",
    "imageio-ffmpeg>=0.5.1,<0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[project.scripts]
commercial-suite = "commercial_suite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
