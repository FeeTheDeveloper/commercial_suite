# Reusable video layout. Campaigns reference templates by name.
# Scene roles: intro, message, cta, outro. Duration weights are
# normalized against the campaign's duration_seconds.

name: "product_promo"
description: "Product promotion: hook, offer, call to action, brand outro."
scenes:
  - role: "intro"
    heading: "{company_name}"
    body: "{tagline}"
    background: "primary"
    duration_weight: 2
  - role: "message"
    heading: "{message}"
    body: ""
    background: "background"
    duration_weight: 4
  - role: "cta"
    heading: "{cta}"
    body: "{website}"
    background: "accent"
    duration_weight: 3
  - role: "outro"
    heading: "{company_name}"
    body: "{disclaimer}"
    background: "secondary"
    duration_weight: 1
